const roundDone = (g, i) => !!g.scores[i] && g.players.every(id => typeof g.scores[i][id] === "number");
const totalsOf = g => g.players.map(id => ({ id, total: Object.values(g.scores).reduce((s, r) => s + (r && typeof r[id] === "number" ? r[id] : 0), 0) }));

const dealerIdx = (g, r) => (g.dealer + r) % Math.max(g.players.length, 1);
// Joining and leaving mid-game. Whoever is dealing now keeps the deal either way.
const keepDealer = (players, who, round) => { const n = players.length, at = Math.max(0, players.indexOf(who)); return ((at - round) % n + n) % n; };
// A late player takes the highest score of every finished round (or 0 if the table prefers),
// so joining late never helps, and finished rounds stay finished.
function addToGame(g, pid, info, start) {
  const dealing = g.players[dealerIdx(g, g.round)], players = [...g.players, pid], scores = { ...g.scores };
  ROUNDS.forEach((_, i) => { if (!roundDone(g, i)) return; const row = g.scores[i];
    scores[i] = { ...row, [pid]: start === "zero" ? 0 : Math.max(...g.players.map(id => row[id])) }; });
  return { ...g, players, scores, names: { ...(g.names || {}), [pid]: info }, joined: { ...(g.joined || {}), [pid]: g.round }, dealer: keepDealer(players, dealing, g.round) };
}
// Leaving keeps the player's name for the results. Nobody can leave a two-player game.
function dropFromGame(g, pid) {
  const i = g.players.indexOf(pid); if (i < 0 || g.players.length <= 2) return g;
  const dealing = g.players[dealerIdx(g, g.round)], next = dealing === pid ? g.players[(i + 1) % g.players.length] : dealing;
  const players = g.players.filter(id => id !== pid);
  return { ...g, players, left: { ...(g.left || {}), [pid]: g.round }, dealer: keepDealer(players, next, g.round) };
}

      if (k > 0) { const d = rs[k - 1].v - x.v; if (!cb || d > cb.d) cb = { d, from: rs[k - 1].v, to: x.v, i: x.i }; }

}

// ── 1. Awards ─────────────────────────────────────────────────────
function gameAwards(game) {
  const per = stPerPlayer(game), awards = [];

  const o = stTopOne(per, x => x.outs);
  if (o) awards.push({ key: "clean", ic: "out", t: "Clean hands", id: o.id, d: "Went out " + stPlural(o.outs, "time") });

  const b = stTopOne(per, x => x.buyN);
  if (b) awards.push({ key: "bargain", ic: "mayi", t: "Bargain hunter", id: b.id, d: "Said “May I?” " + stPlural(b.buyN, "time") });

  const c = stTopOne(per.filter(x => x.cb && x.cb.d >= 10), x => x.cb.d);
  if (c) awards.push({ key: "comeback", ic: "bolt", t: "Comeback kid", id: c.id, d: "From " + c.cb.from + " to " + c.cb.to + " in round " + (c.cb.i + 1) });

  const eligible = per.filter(x => x.rs.length >= 3);
  if (eligible.length > 1) {
    const s = [...eligible].sort((x, y) => x.spread - y.spread);
    if (s[0].spread <= 20 && s[0].spread < s[1].spread)
      awards.push({ key: "steady", ic: "chart", t: "Steady hand", id: s[0].id, d: "Every round within " + s[0].spread + " points" });
  }

  const h = stTopOne(per.filter(x => x.worst), x => x.worst.v);
  if (h) awards.push({ key: "heavy", ic: "calc", t: "Heavy pockets", id: h.id, d: "Caught with " + h.worst.v + " in round " + (h.worst.i + 1) });

  const jokers = game.players.map(id => ({ id, n: 0 }));
  Object.values(game.hands || {}).forEach(r => jokers.forEach(j => {
    ((r && r[j.id]) || []).forEach(t => { if (stNorm(t) === "JOKER") j.n++; });
  }));
  const j = stTopOne(jokers, x => x.n);
  if (j) awards.push({ key: "joker", ic: "flag", t: "Joker juggler", id: j.id, d: "Caught with " + stPlural(j.n, "joker") + ", worth " + j.n * 15 });

  return awards;
}

// ── 2. Still in it ────────────────────────────────────────────────
// nameOf (optional): function id→name, a {id: name} map, or an array of {id, name}.
function stNamer(nameOf) {
  if (typeof nameOf === "function") return nameOf;
  if (Array.isArray(nameOf)) return id => { const p = nameOf.find(x => x.id === id); return p ? p.name : "the leader"; };
  if (nameOf && typeof nameOf === "object") return id => nameOf[id] || "the leader";
  return () => "the leader";
}
function chaseNotes(game, nameOf) {
  if (game.status && game.status !== "live") return [];
  const done = stDoneRounds(game), left = ST_ROUND_COUNT - done.length;
  if (!done.length || !left || game.players.length < 2) return [];
  const name = stNamer(nameOf);
  const totals = stTotals(game, done);
  const ranked = game.players.map(id => ({ id, total: totals[id] })).sort((a, b) => a.total - b.total);
  const per = stPerPlayer(game), leader = ranked[0], L = per.find(x => x.id === leader.id);
  const lw = L.worst ? L.worst.v : 0, la = L.avg, ln = name(leader.id);
  const rounds = stPlural(left, "round");

  return ranked.slice(1).filter(p => p.total > leader.total).map(p => {
    const gap = p.total - leader.total, pr = Math.ceil(gap / left);
    const me = per.find(x => x.id === p.id);
    let text;
    if (pr <= 12 || gap <= la * left * 0.6)
      text = (gap <= 15 ? "Only " + gap : gap) + " behind with " + rounds + " left. Beat " + ln + " by about " + pr + " a round and it's yours.";
    else if (lw >= gap / 2)
      text = gap + " behind with " + rounds + " left, so about " + pr + " a round. " + ln + " has had a " + lw + "-point round before. One big swing changes everything.";
    else
      text = gap + " behind with " + rounds + " left, about " + pr + " a round. Go down early and dump high cards to chip away." +
        (lw > 0 ? " " + ln + "'s worst round so far was " + lw + "." : "");
    if (me && me.outs > 0 && p.id === ranked[ranked.length - 1].id) text += " You've gone out before, so you know how.";
    return { id: p.id, text };
  });
}

// ── 3. What got people caught ─────────────────────────────────────
function caughtStats(game) {
  const rules = stRules(game), done = stDoneRounds(game);
  const pts = {}, ranks = {};
  ST_CATS.forEach(c => { pts[c.key] = 0; });
  Object.values(game.hands || {}).forEach(r => game.players.forEach(pid => {
    ((r && r[pid]) || []).forEach(raw => {
      const t = stNorm(raw), cat = stCategory(t, rules), v = stValue(t, rules);
      if (!cat) return;
      pts[cat] += v;
      const rk = stRank(t);
      ranks[rk] = ranks[rk] || { token: rk, pts: 0, count: 0 };
      ranks[rk].count++; ranks[rk].pts += v;
    });
  }));
  const total = Object.values(pts).reduce((s, v) => s + v, 0);
  const cats = total > 0
    ? ST_CATS.filter(c => pts[c.key] > 0).map(c => ({ key: c.key, label: c.label, pts: pts[c.key], pct: Math.round(pts[c.key] / total * 100) }))
        .sort((a, b) => b.pts - a.pts)
    : [];

  const top = Object.values(ranks).sort((a, b) => b.count - a.count || b.pts - a.pts)[0];
  const topCard = top && top.count > 1 ? { token: top.token, pts: top.pts, count: top.count } : null;

  let toughest = null;
  if (done.length > 1) done.forEach(i => {
    const t = game.players.reduce((s, id) => s + game.scores[i][id], 0);
    if (!toughest || t > toughest.total) toughest = { round: i, total: t };
  });

  let buyWarning = null;
  const per = stPerPlayer(game), heavy = per.filter(x => x.buyN >= 3);
  if (heavy.length && done.length) {
    const avgAll = per.reduce((s, x) => s + x.avg, 0) / per.length;
    const avgBuy = heavy.reduce((s, x) => s + x.avg, 0) / heavy.length;
    if (avgBuy > avgAll + 3)
      buyWarning = "Heavy buying is backfiring. Big buyers are averaging " + Math.round(avgBuy) + " a round against a table average of " +
        Math.round(avgAll) + ". Each buy adds a penalty card.";
  }
  return { cats, topCard, toughest, buyWarning };
}

// ── Group history helpers ─────────────────────────────────────────
function stGroupGames(state, groupId) {
  return Object.values((state && state.games) || {})
    .filter(g => g.groupId === groupId && g.status === "done")
    .sort((a, b) => (a.endedAt || 0) - (b.endedAt || 0));
}
function stWinners(g) {
  const t = stTotals(g), best = Math.min(...g.players.map(id => t[id]));
  return { totals: t, best, ids: g.players.filter(id => t[id] === best) };
}
function stStreaks(games, pid) {
  let cur = 0, best = 0, bestAt = null;
  games.filter(g => g.players.includes(pid)).forEach(g => {
    if (stWinners(g).ids.includes(pid)) { cur++; if (cur > best) { best = cur; bestAt = g.endedAt || 0; } } else cur = 0;
  });
  return { current: cur, best, bestAt };
}

// ── 4. Player profile ─────────────────────────────────────────────
function playerProfile(state, groupId, playerId) {
  const games = stGroupGames(state, groupId).filter(g => g.players.includes(playerId));
  let wins = 0, sum = 0, outs = 0, buys = 0, roundsWon = 0, bestGame = null, bestRound = null;
  const badges = {}, h2h = {};
  games.forEach(g => {
    const w = stWinners(g), mine = w.totals[playerId];
    if (w.ids.includes(playerId)) wins++;
    sum += mine;
    if (!bestGame || mine < bestGame.total) bestGame = { total: mine, gameId: g.id };
    buys += stBuysOf(g, playerId);
    stDoneRounds(g).forEach(i => {
      const r = g.scores[i], v = r[playerId];
      if (v === 0) outs++;
      if (v === Math.min(...g.players.map(id => r[id]))) roundsWon++;
      if (!bestRound || v < bestRound.v) bestRound = { v, gameId: g.id, round: i };
    });
    gameAwards(g).forEach(a => { if (a.id === playerId) badges[a.key] = (badges[a.key] || 0) + 1; });
    g.players.forEach(o => {
      if (o === playerId) return;
      const h = h2h[o] = h2h[o] || { id: o, played: 0, wins: 0, losses: 0 };
      h.played++;
      if (mine < w.totals[o]) h.wins++; else if (mine > w.totals[o]) h.losses++;

  });
  const s = stStreaks(games, playerId);
  return {
    games: games.length, wins, winRate: games.length ? wins / games.length : 0,
    avg: games.length ? sum / games.length : 0,
    bestGame, bestRound, outs, buys,
    streak: { current: s.current, best: s.best },
    badges, roundsWon,
    h2h: Object.values(h2h).sort((a, b) => b.played - a.played),
  };
}

// ── 5. Group records ──────────────────────────────────────────────
// Ties go to whoever set the record first (chronologically); for most games, group order.
function groupRecords(state, groupId) {
  const games = stGroupGames(state, groupId);
  const group = state && state.groups && state.groups[groupId];
  const members = [];
  (group ? group.players.map(p => p.id) : []).concat(...games.map(g => g.players)).forEach(id => { if (!members.includes(id)) members.push(id); });

  let lowestWin = null, mostOuts = null, longestStreak = null, mostGames = null;
  games.forEach(g => {
    const w = stWinners(g);
    if (!lowestWin || w.best < lowestWin.v) lowestWin = { v: w.best, id: w.ids[0], ids: w.ids, gameId: g.id };
    const done = stDoneRounds(g);
    g.players.forEach(id => {
      const n = done.filter(i => g.scores[i][id] === 0).length;
      if (n > 0 && (!mostOuts || n > mostOuts.v)) mostOuts = { v: n, id, gameId: g.id };
    });
  });
  members.forEach(id => {
    const s = stStreaks(games, id);

    if (n > 0 && (!mostGames || n > mostGames.v)) mostGames = { v: n, id };

// ── 6. Rank moves ─────────────────────────────────────────────────
function rankMoves(game) {
  const done = stDoneRounds(game);
  if (done.length < 2) return {};
  const now = stPositions(stTotals(game, done)), before = stPositions(stTotals(game, done.slice(0, -1)));
  const out = {};
  game.players.forEach(id => { out[id] = before[id] - now[id]; });
  return out;
}

.row-ic.soft { background: var(--fill); color: var(--ink2); }
.row-ic.add { color: var(--accent); }
.num-trail { display: grid; justify-items: end; line-height: 1.05; } .num-trail b { font: 600 1.3rem var(--num); color: var(--ink); font-variant-numeric: tabular-nums; } .num-trail small { font-size: .72rem; }
.avs { display: flex; } .avs .peg + .peg { margin-left: -9px; } .avs .peg { box-shadow: 0 0 0 2px var(--surface); }
.row.edit { gap: 10px; padding: 6px 8px 6px 12px; }
.row-input { flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; font-size: 1rem; outline: none; color: var(--ink); }
.row-input.solo { padding: 0 16px; min-height: 54px; width: 100%; }
.row-input::placeholder { color: var(--ink3); }
.code-in { text-align: center; font: 600 1.5rem var(--num); letter-spacing: .25em; text-transform: uppercase; }
.peg-btn { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; position: relative; }
.peg-badge { position: absolute; right: 1px; bottom: 2px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ink2); box-shadow: 0 0 0 var(--hair) var(--line); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 13px; font-size: 1rem; font-weight: 600; }
.btn.lg { min-height: 56px; border-radius: 16px; font-size: 1.06rem; }
.btn.sm { min-height: 36px; padding: 0 14px; border-radius: 10px; }
.btn.block { width: 100%; }
/* Buttons are lit from above like a candy game piece: a soft top highlight and a darker lower edge,
   all inside the shape. No outer shadow. Pressing sinks them a touch and dims the light. */
.btn { position: relative; transition: transform .28s var(--spring), filter .15s, box-shadow .15s; }
.btn.primary { color: var(--cta-ink); font-weight: 750; background: linear-gradient(180deg, var(--cta-hi) 0%, var(--cta) 55%); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 0 var(--cta-edge); padding-bottom: 3px; }
.btn.primary:active:not(:disabled) { transform: translateY(2px) scale(.985); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 var(--cta-edge); padding-bottom: 1px; }
.btn.primary:disabled { background: var(--fill); color: var(--ink3); box-shadow: none; }
.btn.tonal { background: var(--accent-soft); color: var(--accent); font-weight: 700; box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--accent) 20%, transparent); padding-bottom: 2px; }
.btn.tonal:active:not(:disabled) { filter: brightness(.95); }
.btn.tonal.danger { background: color-mix(in srgb, var(--red) 11%, transparent); color: var(--red); box-shadow: inset 0 0 0 var(--hair) color-mix(in srgb, var(--red) 24%, transparent); }
.btn:disabled { opacity: 1; } .btn.tonal:disabled { background: var(--fill); color: var(--ink3); box-shadow: none; }
.btn.plain { color: var(--accent); }
.btn.out { background: var(--out-soft); color: var(--out); flex: none; } .btn.out.on { background: var(--out); color: var(--surface); } .btn.out:disabled { background: var(--fill); color: var(--ink3); }
.btn.on-band { color: var(--band-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--band-ink) 35%, transparent); }
.btn.gold { background: linear-gradient(180deg, var(--cta-hi) 0%, var(--cta) 55%); color: var(--cta-ink); font-weight: 750; box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 0 var(--cta-edge); padding-bottom: 3px; }
.btn.gold:active { transform: translateY(2px) scale(.985); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 var(--cta-edge); }
.row2 { display: flex; gap: 10px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; justify-content: center; padding: 14px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
.dock > * { max-width: 688px; }

/* Peg avatar */
.peg { flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--peg); color: var(--peg-ink); font-weight: 700; line-height: 1; }
.peg.ring { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 5px var(--gold-ring); }

/* Home */
.now-card { display: grid; gap: 4px; width: 100%; text-align: left; color: var(--band-ink); border-radius: 20px; padding: 16px 18px; margin-bottom: 4px;
  background: radial-gradient(120% 140% at 30% 0%, color-mix(in srgb, var(--band) 86%, #fff) 0%, var(--band) 45%, var(--band2) 100%); box-shadow: 0 0 0 var(--hair) var(--line); }
.now-top { display: flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; color: var(--band-ink2); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #5BE39A; animation: blink 1.6s ease-in-out infinite; }
.now-name { font: 700 1.7rem/1.1 var(--display); letter-spacing: -.01em; margin-top: 2px; }
.now-sub { color: var(--band-ink2); }
.now-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-weight: 600; font-size: .9rem; }
.now-foot svg { color: #E6C463; vertical-align: -2px; margin-right: 4px; }
.now-foot .avs .peg { box-shadow: 0 0 0 2px var(--band); }
.now-go { display: inline-flex; align-items: center; }
.welcome { text-align: center; padding: 10px 8px 0; display: grid; gap: 12px; }
.welcome h2 { font: 700 1.6rem var(--display); letter-spacing: -.01em; margin: 12px 0 0; }
.welcome p { color: var(--ink2); margin: 0 auto 10px; max-width: 40ch; }
.fan { position: relative; height: 150px; display: flex; justify-content: center; align-items: flex-end; }
.fan > span { position: absolute; bottom: 0; font-size: 19px; transform-origin: 50% 120%; transform: rotate(calc((var(--i) - 1.5) * 12deg)); animation: fanIn .7s calc(var(--i) * 90ms) var(--spring) both; }

/* Cards (em-sized) */
.pc { position: relative; display: inline-block; flex: none; width: 2.9em; height: 4.1em; border-radius: .42em; background: linear-gradient(170deg, #FFFFFF, #F6F5F1); color: #15181A;
  box-shadow: 0 0 0 .5px rgba(20,24,30,.28), 0 1px 1px rgba(0,0,0,.08), 0 3px 8px -3px rgba(0,0,0,.35); font-size: 10px; }
.pc.red { color: #C8283A; }
.pc + .pc { margin-left: -1.15em; }
.pc-corner { position: absolute; top: .3em; left: .35em; display: grid; justify-items: center; line-height: .95; }
.pc-corner b { font: 700 1.1em/1 var(--font); letter-spacing: -.05em; } .pc-corner i { font-style: normal; font-size: .95em; }
.pc-pip { position: absolute; right: .3em; bottom: .15em; font-size: 1.8em; line-height: 1; }
.melds { display: flex; flex-wrap: wrap; gap: 10px; } .meld { display: inline-flex; }
.meld .pc:nth-child(2) { transform: translateY(-1px); } .meld .pc:nth-child(3) { transform: translateY(-2px); }

/* Game */
.game { min-height: 100vh; min-height: 100dvh; }
.band { color: var(--band-ink); border-radius: 0 0 30px 30px; padding: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) 18px max(8px, env(safe-area-inset-left));
  background: radial-gradient(120% 140% at 30% 0%, color-mix(in srgb, var(--band) 86%, #fff) 0%, var(--band) 45%, var(--band2) 100%); }
[data-look="daylight"] .band, [data-look="daylight"] .now-card, [data-look="daylight"] .finale, [data-look="daylight"] .scoreboard { box-shadow: inset 0 0 0 2px #000; }
.band-row { display: flex; align-items: center; min-height: 48px; max-width: 720px; margin: 0 auto; }
.nav-back.on-band, .nav-icon.on-band { color: var(--band-ink); }
.contract { display: grid; gap: 8px; text-align: left; color: inherit; max-width: 720px; margin: 0 auto; padding: 0 10px; width: 100%; }
.c-round { font-weight: 600; font-size: .9rem; } .c-round span { color: var(--band-ink2); font-weight: 500; }
.c-name { font: 700 2.15rem/1.05 var(--display); letter-spacing: -.01em; animation: rise .45s var(--out-e) both; }
.contract .melds { font-size: 11px; margin: 4px 0; }
.contract .pc { font-size: 9.5px; }
.c-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.pips { display: inline-flex; gap: 5px; align-items: center; margin-right: 4px; }
.pips i { width: 6px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--band-ink) 30%, transparent); transition: width .4s var(--spring); }
.pips i.done { background: color-mix(in srgb, var(--band-ink) 80%, transparent); }
.pips i.now { width: 18px; background: #F2C766; }
.tag { display: inline-flex; align-items: center; gap: 2px; font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: color-mix(in srgb, var(--band-ink) 14%, transparent); }
.rules-tag { margin-left: auto; }
.table-body { max-width: 720px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.seats-head { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 600; color: var(--ink3); margin: 4px 16px 7px; }
.seats { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 var(--hair) var(--line), 0 6px 20px -8px rgba(10,30,20,.18); }
.seat { position: relative; display: flex; align-items: center; gap: 12px; min-height: 74px; padding: 10px 12px 10px 14px; animation: rise .45s calc(var(--i) * 40ms) var(--out-e) both; }
.seat + .seat::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: var(--hair); background: var(--line); }
.seat.lead { background: linear-gradient(90deg, var(--gold-soft), transparent 75%); }
.seat-av { position: relative; flex: none; }
.dealer { position: absolute; right: -4px; bottom: -3px; width: 19px; height: 19px; border-radius: 50%; background: #F2C766; color: #3A2A05; font-size: .62rem; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
.seat-main { flex: 1; min-width: 0; display: grid; }
.seat-main b { font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.crown-ic { color: var(--gold-ring); display: inline-flex; } .crown-ic svg { fill: currentColor; }
.seat-main small { color: var(--ink3); font-size: .82rem; }
.seat.lead .seat-main small { color: var(--gold); font-weight: 600; }
.seat-total { font: 650 1.4rem var(--num); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.chip { min-height: 30px; padding: 0 9px; border-radius: 9px; background: var(--fill); color: var(--ink2); font: 600 .82rem var(--num); font-variant-numeric: tabular-nums; flex: none; }
.chip.out { background: var(--out-soft); color: var(--out); }
.buy { display: flex; align-items: center; gap: 2px; flex: none; }
.buy-pill { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 66px; min-height: 48px; padding: 4px 10px; border-radius: 13px; background: var(--fill); font-weight: 600; font-size: .85rem; line-height: 1; }
.buy-pill.has { background: var(--gold-soft); color: var(--gold); }
.buy-pill:disabled { opacity: .5; }
.dots { display: inline-flex; gap: 4px; } .dots i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; opacity: .5; transition: transform .3s var(--spring); }
.dots i.on { background: currentColor; opacity: 1; transform: scale(1.15); }
.buy-minus { width: 30px; height: 44px; display: grid; place-items: center; color: var(--ink3); }
/* May I? pill: a small lit tile; each buy drops a poker chip into the row. */
.buy-pill { box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 45%, transparent), inset 0 0 0 var(--hair) var(--line); }
.buy-pill.has { color: var(--ink); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 45%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--gold-ring) 55%, transparent); }
.buy-pill .dots i { width: 8px; height: 8px; }
.buy-pill .dots i.on { background: radial-gradient(circle, var(--surface) 0 1.3px, transparent 1.8px), var(--gold-ring); box-shadow: none; transform: scale(1.12); }
/* Score pad keys: number keys are lit tiles; card keys look like the cards they stand for. */
.numpad .nk { background: var(--surface); box-shadow: inset 0 0 0 var(--hair) var(--line), inset 0 -2px 0 color-mix(in srgb, var(--line) 70%, transparent); transition: transform .25s var(--spring), background .12s; }
.numpad .nk:active { background: var(--fill); box-shadow: inset 0 0 0 var(--hair) var(--line); }
.numpad .nk.fn { box-shadow: none; background: transparent; }
.keys .key { position: relative; min-height: 60px; border-radius: 10px; background: linear-gradient(170deg, #FFFFFF, #F4F2EC); color: #15181A;
  box-shadow: 0 0 0 .5px rgba(20,24,30,.28), 0 1px 0 rgba(20,24,30,.12); }
.keys .key b { font: 700 1.2rem var(--display); } .keys .key small { color: #6B6F72; font-weight: 600; }
.keys .key:active { background: #EEEBE3; }
.arace { margin: 18px 0 0; }
.hero-podium { grid-column: 1 / -1; display: grid; gap: 4px; margin-top: 2px; }
.hero-podium .hero-sub b { color: var(--band-ink); }
.podium.mini { margin-top: 10px; gap: 6px; }
.podium.mini .pod { color: var(--band-ink); }
.podium.mini .pod > span:not(.crown):not(.peg) { font-size: .82rem; }
.podium.mini .pod.p1 .pod-block { height: 62px; } .podium.mini .pod.p2 .pod-block { height: 44px; } .podium.mini .pod.p3 .pod-block { height: 30px; }
.podium.mini .pod-block { font-size: 1.2rem; padding-top: 6px; }
.race-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 16px 7px; font-size: .8rem; font-weight: 600; color: var(--ink3); }
.race-h small { font-weight: 500; }
.race-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 -2px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.race-row::-webkit-scrollbar { display: none; }
.race-chip { flex: none; scroll-snap-align: start; display: flex; align-items: center; gap: 9px; padding: 9px 10px 9px 9px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); animation: rise .45s var(--out-e) both; }
.race-ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--gold-soft); color: var(--ink); flex: none; }
.race-t { display: grid; line-height: 1.2; } .race-t b { font-size: .85rem; } .race-t small { color: var(--ink3); font-size: .78rem; }
.tip { display: flex; gap: 8px; align-items: flex-start; color: var(--ink2); font-size: .9rem; margin: 14px 16px 0; }
.tip svg { flex: none; margin-top: 2px; color: var(--gold-ring); }
.game.wide .table-body { max-width: 1000px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 0 24px; align-items: start; }
.game.wide .rstrip, .game.wide .seats-head, .game.wide .seats, .game.wide .tip { grid-column: 1; }
.game.wide .grid-wrap { grid-column: 2; grid-row: 1 / span 4; margin-top: 0; }
.game.wide .band-row, .game.wide .contract { max-width: 1000px; }

/* Score pad */
.who-strip { display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 4px; scrollbar-width: none; } .who-strip::-webkit-scrollbar { display: none; }
.who { flex: none; display: grid; justify-items: center; gap: 3px; min-width: 66px; padding: 8px 6px; border-radius: 14px; box-shadow: inset 0 0 0 1.5px transparent; transition: background .15s, box-shadow .15s; }
.who span { font-size: .8rem; font-weight: 600; max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who b { font: 600 .82rem var(--num); color: var(--ink3); } .who.done b { color: var(--ink); }
.who.on { background: var(--fill); box-shadow: inset 0 0 0 1.5px var(--accent); }
.who:not(.on):not(.done) .peg { opacity: .5; }
.pad-display { text-align: center; display: grid; padding: 4px 0; }
.pad-display b { font: 650 4.4rem/1 var(--num); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.pad-display small { color: var(--ink3); }
.pad-display.zero b { color: var(--out); } .pad-display.empty b { color: var(--line); }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.nk { min-height: 58px; border-radius: 14px; background: var(--fill); font: 600 1.6rem var(--num); display: grid; place-items: center; }
.nk:active { background: var(--line); } .nk.fn { background: transparent; color: var(--ink2); }
.hand { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 58px; align-content: center; }
.hcard { width: 44px; height: 58px; border-radius: 8px; background: linear-gradient(170deg, #FFFFFF, #F6F5F1); color: #15181A; box-shadow: 0 0 0 .5px rgba(20,24,30,.3), 0 2px 5px -2px rgba(0,0,0,.3); display: grid; place-content: center; text-align: center; animation: pop .3s var(--spring) both; }
.hcard b { font-size: 1rem; } .hcard small { font-size: .68rem; color: #555; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.key { min-height: 56px; border-radius: 12px; background: var(--fill); display: grid; place-content: center; text-align: center; }
.key b { font-size: 1.1rem; } .key small { font-size: .7rem; color: var(--ink3); }

/* Round intro: the next contract dealt as one big card */
.intro { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
  background: color-mix(in srgb, var(--band2) 82%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: fade .25s ease both; }
.intro.out { animation: fade .26s ease reverse both; }
.intro-won { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 7px 14px; border-radius: 99px; background: #fff; color: #1B2150; font-weight: 700; font-size: .9rem; animation: rise .4s var(--out-e) both; }
[data-look="daylight"] .intro { background: rgba(255,255,255,.9); } [data-look="daylight"] .intro-won { background: #000; color: #fff; }
.big-card { position: relative; width: min(78vw, 310px); aspect-ratio: 5 / 7; border-radius: 24px; background: #fff; color: #15181A;
  box-shadow: inset 0 0 0 9px #fff, inset 0 0 0 13px color-mix(in srgb, var(--band) 30%, #fff), 0 0 0 1px rgba(0,0,0,.08), 0 30px 70px -18px rgba(10,20,60,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 46px 22px; text-align: center;
  animation: deal2 .65s var(--spring) both; }
.intro.out .big-card { animation: dealOut .26s ease-in both; }
.bc-idx { position: absolute; top: 14px; left: 16px; display: grid; justify-items: center; line-height: .95; } .bc-idx b { font: 700 1.6rem var(--display); } .bc-idx i { font-style: normal; font-size: 1.3rem; }
.bc-idx.flip { top: auto; left: auto; bottom: 14px; right: 16px; transform: rotate(180deg); }
.big-card.red .bc-idx { color: #C8283A; }
.bc-round { font-size: .85rem; font-weight: 600; color: #5A5F66; }
.big-card h2 { font: 700 2.1rem/1.02 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.big-card .melds { justify-content: center; font-size: 11px; margin: 6px 0; } .big-card .pc { font-size: 10px; }
.bc-deal { font-weight: 600; font-size: .9rem; } .bc-tip { color: #5A5F66; font-size: .82rem; max-width: 24ch; }
.intro-actions { display: flex; gap: 10px; width: min(78vw, 310px); }
.intro-actions .btn.on-band { --band-ink: #fff; }
[data-look="daylight"] .intro-actions .btn.on-band { --band-ink: #000; }

/* Scoreboard */
.scoreboard { min-height: 100vh; min-height: 100dvh; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; color: var(--band-ink);
  background: radial-gradient(120% 140% at 30% 0%, color-mix(in srgb, var(--band) 86%, #fff) 0%, var(--band) 45%, var(--band2) 100%); }
.sb-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; } .sb-head > span:first-child { color: var(--band-ink2); font-weight: 600; }
.sb-head h1 { margin: 0; font: 700 2.6rem var(--display); letter-spacing: -.01em; } .sb-head .melds { font-size: 13px; }
.scoreboard .seats { flex: 1; display: flex; flex-direction: column; color: var(--ink); }
.scoreboard .seat { flex: 1; padding: 14px 28px; gap: 22px; } .scoreboard .seat + .seat::before { left: 110px; }
.scoreboard .seat-main b { font-size: clamp(1.4rem, 2.6vw, 2.4rem); } .scoreboard .seat-main small { font-size: clamp(.95rem, 1.4vw, 1.3rem); }
.scoreboard .seat-total { font-size: clamp(2.2rem, 4.4vw, 4rem); }

/* Round grid */
.grid-wrap { overflow-x: auto; background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 var(--hair) var(--line); }
.sgrid { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.sgrid th { font-size: .72rem; font-weight: 600; color: var(--ink3); padding: 10px 6px 8px; } .sgrid th.now { color: var(--accent); }
.sgrid td { padding: 9px 6px; text-align: center; border-top: var(--hair) solid var(--line); color: var(--ink2); font-family: var(--num); }
.sgrid .l { text-align: left; padding-left: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; font-family: var(--font); }
.sgrid td.zero { color: var(--out); font-weight: 600; } .sgrid td.t { font-weight: 700; color: var(--ink); padding-right: 14px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

/* Recap */
.finale { position: relative; overflow: hidden; color: var(--band-ink); border-radius: 22px; padding: 26px 16px 0; text-align: center;
  background: radial-gradient(120% 140% at 30% 0%, color-mix(in srgb, var(--band) 86%, #fff) 0%, var(--band) 45%, var(--band2) 100%); }
.finale-date { display: inline-block; margin: 0; padding: 5px 12px; border-radius: 99px; background: rgba(255,255,255,.2); color: var(--band-ink); font-weight: 700; font-size: .82rem; }
[data-look="daylight"] .finale-date { background: var(--fill); }
.finale h2 { font: 700 clamp(2.1rem, 9vw, 2.9rem)/1.05 var(--display); letter-spacing: -.01em; margin: 8px 0 6px; text-wrap: balance; animation: rise .5s .1s var(--out-e) both; }
.finale-sub { margin: 0; color: var(--band-ink2); }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-top: 28px; }
.pod { flex: 1; max-width: 120px; display: grid; justify-items: center; gap: 3px; animation: rise .6s var(--out-e) both; animation-delay: calc(.35s + var(--i) * .15s); }
.pod b { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pod > span:not(.crown):not(.peg) { color: var(--band-ink2); font: 600 1rem var(--num); }
.pod .crown { transform: rotate(-8deg); margin-bottom: -2px; filter: drop-shadow(0 2px 0 rgba(10,20,60,.22)); }
.pod-block { width: 100%; margin-top: 6px; border-radius: 10px 10px 0 0; background: color-mix(in srgb, var(--band-ink) 12%, transparent); display: grid; place-items: start center; padding-top: 10px; font: 700 1.6rem/1 var(--display); color: var(--band-ink2); }
.pod.p1 .pod-block { height: 104px; background: linear-gradient(180deg, #FFE27A, #FFC21A); color: #6B4300; } .pod.p2 .pod-block { height: 74px; background: linear-gradient(180deg, #F4F7FA, #C9D3DE); color: #36414D; } .pod.p3 .pod-block { height: 52px; background: linear-gradient(180deg, #FFCBA4, #E58F55); color: #55260B; }
.pod-block { box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -4px 0 rgba(0,0,0,.14); }
.hero.felt .peg, .finale .peg, .scoreboard .peg, .now-card:not(.again) .peg { box-shadow: 0 0 0 3px #fff, 0 4px 10px -1px rgba(10,20,60,.32); }
.hero.felt .peg.ring, .finale .peg.ring { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--gold-ring), 0 5px 12px 4px rgba(10,20,60,.28); }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* Sheets */
/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; justify-content: center;
  padding: 4px max(8px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); border-top: var(--hair) solid var(--line); }
.tabbar-in { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 460px; }
.tab { display: grid; justify-items: center; align-content: center; gap: 1px; min-height: 52px; color: var(--ink3); font-size: .7rem; font-weight: 600; letter-spacing: .01em; }
.tab.on { color: var(--accent); }
.tab-ic { display: grid; place-items: center; width: 54px; height: 30px; border-radius: 99px; transition: background .25s var(--out-e), transform .3s var(--spring); }

.tab:active .tab-ic { transform: scale(.9); }
.page-lede { margin: -6px 4px 14px; color: var(--ink2); font-size: 1rem; line-height: 1.45; max-width: 52ch; }
.empty-state { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 36px 20px; border-radius: 20px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.empty-state h2 { margin: 4px 0 0; font: 700 1.4rem var(--display); letter-spacing: -.005em; } .empty-state p { margin: 0; color: var(--ink2); max-width: 32ch; line-height: 1.45; }
.empty-ic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--gold-soft); color: var(--ink); }
.cabinet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .cabinet { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.trophy { display: grid; gap: 6px; align-content: start; padding: 14px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); min-width: 0; }
.trophy > b { font-size: .95rem; line-height: 1.2; }
.trophy-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--gold-soft); color: var(--ink); }
.trophy.empty .trophy-ic { background: var(--fill); color: var(--ink3); } .trophy.empty > b { color: var(--ink2); }
.trophy > small { color: var(--ink3); font-size: .82rem; }
.trophy-who { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; min-width: 0; }
.trophy-who small { color: var(--ink3); font-weight: 600; margin-left: auto; font-variant-numeric: tabular-nums; }
.seats-meta { display: inline-flex; align-items: center; gap: 10px; }
.seats-edit { position: relative; isolation: isolate; min-height: 44px; margin: -6px 0; }
.seats-edit::before { content: ""; position: absolute; inset: 6px 0; border-radius: 99px; background: var(--accent-soft); z-index: -1; }
.seats-edit { display: inline-flex; align-items: center; gap: 5px; padding: 0 11px; border-radius: 99px; color: var(--accent); font: 600 .8rem/1 var(--sans, inherit); text-transform: none; letter-spacing: 0; }
.seats-edit:active { transform: scale(.96); }
.row-add { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
html.locked, html.locked body { overflow: hidden; overscroll-behavior: none; }
.scrim { position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-h, 100%); z-index: 30; background: rgba(0,0,0,.36); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
.scrim.out { animation: fade .24s ease reverse both; }
.sheet { width: 100%; max-width: 560px; max-height: 94vh; max-height: calc(var(--vv-h, 100dvh) - 20px); background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.2); animation: up .5s var(--out-e) both; }
.sheet.out { animation: down .24s ease-in both; } .sheet.drag { animation: none; transition: none; } .sheet.tall { min-height: min(72vh, calc(var(--vv-h, 100dvh) - 20px)); }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 22px; max-height: 86vh; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 16px 10px 6px 20px; position: relative; touch-action: none; }
.grab { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; border-radius: 3px; background: var(--line); transform: translateX(-50%); }
.sheet-head h2 { flex: 1; margin: 6px 0 0; font: 700 1.35rem var(--display); letter-spacing: -.005em; }
.sheet-head .icon-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); color: var(--ink2); display: grid; place-items: center; margin-right: 6px; }
.sheet-body { padding: 8px 16px 20px; overflow-y: auto; display: grid; grid-auto-rows: max-content; gap: 12px; align-content: start; overscroll-behavior: contain; }
.sheet-body > .group-h { margin-bottom: -5px; } .sheet-body > .group-f { margin-top: -5px; }
.sheet-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: var(--hair) solid var(--line); }
.seg { display: flex; background: var(--fill); border-radius: 11px; padding: 2px; gap: 2px; }
.seg button { flex: 1; min-height: 38px; border-radius: 9px; font-weight: 600; font-size: .88rem; color: var(--ink2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.switch { width: 51px; height: 31px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch span { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 99px; background: #fff; transition: transform .3s var(--spring), width .2s; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
.switch:active span { width: 31px; } .switch.on { background: #34C759; } .switch.on span { transform: translateX(20px); } .switch.on:active span { transform: translateX(16px); }
.stepper { display: flex; align-items: center; gap: 16px; justify-content: center; } .stepper b { font: 600 1.4rem var(--num); min-width: 2ch; text-align: center; }
.round-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
.pick { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 44px; text-align: left; } .pick b { font-weight: 600; }
.check { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; flex: none; color: var(--accent-ink); }
.check.on { background: var(--accent); box-shadow: none; }
.deal-chip { min-height: 32px; padding: 0 12px; border-radius: 99px; font-size: .8rem; font-weight: 600; color: var(--ink3); background: var(--fill); }
.deal-chip.on { background: #F2C766; color: #3A2A05; }
.note { background: var(--gold-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: .9rem; margin: 0; }
.code-box { display: grid; text-align: center; padding: 18px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.code-box small { color: var(--ink3); font-weight: 600; } .code { font: 700 2.4rem var(--num); letter-spacing: .14em; }
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.look { display: grid; gap: 2px; justify-items: start; align-content: start; text-align: left; padding: 12px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.look.on { box-shadow: 0 0 0 2px var(--accent); }
.look-sw { width: 100%; height: 44px; border-radius: 9px; margin-bottom: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.look b { font-weight: 600; } .look small { color: var(--ink3); font-size: .78rem; }
.credits { margin: 0; padding: 0 16px 8px; text-align: center; color: var(--ink3); font-size: .74rem; line-height: 1.4; }
.tip-link { text-align: center; color: var(--ink3); font-size: .9rem; padding: 10px; text-decoration: none; } .tip-link b { color: var(--accent); }
.rule-card { position: relative; background: #FFFEFB; color: #15181A; border-radius: 16px; padding: 22px 18px 18px; text-align: center; display: grid; gap: 6px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.08), inset 0 0 0 6px #FFFEFB, inset 0 0 0 7px rgba(201,154,46,.5), 0 8px 24px -10px rgba(0,0,0,.25); }
.rc-n { font-size: .8rem; font-weight: 600; color: #6B5A2A; } .rule-card h3 { font: 700 1.8rem var(--display); margin: 0; letter-spacing: -.01em; } .rc-line { margin: 0; color: #555; }
.rc-melds { display: flex; justify-content: center; margin: 10px 0; } .rc-melds .melds { justify-content: center; font-size: 13px; } .rc-melds .pc { font-size: 11px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; }
.facts li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #F4F1EA; font-size: .92rem; } .facts svg { flex: none; margin-top: 1px; color: #6B5A2A; }
.rnum { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font: 600 .9rem var(--num); }
.rnum.on { background: var(--accent); color: var(--accent-ink); }
.values { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.values div { background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; display: grid; gap: 2px; }
.values span { font-size: .75rem; color: var(--ink3); font-weight: 600; } .values b { font: 600 1.05rem var(--num); }

/* Toast */
.toast { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 60; width: max-content; max-width: calc(100vw - 32px);
  background: color-mix(in srgb, var(--ink) 92%, transparent); color: var(--bg); border-radius: 99px; padding: 10px 18px; font-weight: 600; font-size: .9rem; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: toastIn .4s var(--spring) both; }


/* Round strip: seven rounds, tap to score or fix */
.rstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 0 0 14px; }
@media (max-width: 380px) { .rstrip { gap: 4px; } }
.rs { display: grid; justify-items: center; gap: 4px; min-height: 48px; padding: 7px 0 6px; border-radius: 12px; background: var(--surface); color: var(--ink3);
  box-shadow: 0 0 0 var(--hair) var(--line); font: 600 .95rem/1 var(--num); transition: transform .15s var(--out-e); }
.rs b { font-weight: 700; }
.rs:active:not(:disabled) { transform: scale(.94); }
.rs:disabled:not(.now) { background: transparent; opacity: .55; }
.rs.done { color: var(--ink); }
.rs.done svg { color: var(--out); }
.rs.now { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.rs-dot { width: 9px; height: 9px; border-radius: 50%; }
.rs-dot.empty { background: color-mix(in srgb, currentColor 28%, transparent); }
.rs.now .rs-dot.empty { background: #F2C766; }
/* Toast with Undo */
.toast.has-undo { display: flex; align-items: center; gap: 14px; padding: 6px 6px 6px 18px; }
.toast-undo { color: var(--bg); font-weight: 700; padding: 8px 14px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 18%, transparent); min-height: 36px; }
.now-card.again { background: var(--surface); color: var(--ink); }
.now-card.again .now-top, .now-card.again .now-sub { color: var(--ink2); }
.now-card.again .now-top svg { color: var(--accent); }
.now-card.again .now-foot svg { color: var(--ink3); }
.now-card.again .now-foot .avs .peg { box-shadow: 0 0 0 2px var(--surface); }
.list.gap { margin-top: 22px; }

/* Coaching: round guide, steps, Q&A, rule hints */
.pc.joker { color: #7A4BD8; }
.rpick { display: flex; justify-content: space-between; gap: 6px; }
.rpick .rnum { width: 40px; height: 40px; font-size: 1rem; }
.rc-goal { margin: 4px 0 0; font-size: .98rem; line-height: 1.4; color: #2A2D2F; text-wrap: pretty; }
.rc-facts { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: .82rem; color: #555; }
.rc-facts b { font: 700 1rem var(--num); color: #15181A; }
.callout { display: flex; gap: 10px; align-items: flex-start; margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); line-height: 1.4; }
.callout svg { flex: none; margin-top: 1px; color: var(--accent); }
.callout.warn { background: var(--gold-soft); box-shadow: none; } .callout.warn svg { color: var(--gold); }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tips li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; padding: 0 4px; }
.tips svg { flex: none; margin-top: 2px; color: var(--accent); } .tips.pro svg { color: var(--gold); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 0 0 16px; position: relative; }
.steps li:not(:last-child)::before { content: ""; position: absolute; left: 14.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line); }
.step-n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 .9rem var(--num); }
.steps b { display: block; font-weight: 600; margin-top: 4px; } .steps small { display: block; color: var(--ink2); font-size: .9rem; line-height: 1.4; margin-top: 2px; }
.qa { border-bottom: var(--hair) solid var(--line); } .qa:last-child { border-bottom: 0; }
.qa summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; font-weight: 600; cursor: pointer; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary svg { flex: none; color: var(--ink3); transition: transform .2s var(--out-e); } .qa[open] summary svg { transform: rotate(90deg); }
.qa p { margin: 0; padding: 0 16px 14px; color: var(--ink2); line-height: 1.45; }
.gloss { gap: 4px; } .gloss small { color: var(--ink2); line-height: 1.4; } .gloss-ex { font-size: 11px; margin-top: 6px; }
.rule-top { display: flex; justify-content: space-between; align-items: center; }
.rule-meta { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; }
.rule-meta small, .rule-hint { color: var(--ink2); font-size: .86rem; line-height: 1.35; }
.why { color: var(--accent); font-weight: 600; font-size: .86rem; padding: 0 2px; min-height: 28px; }
.why-text { grid-column: 1 / -1; margin: 2px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--fill); font-size: .88rem; line-height: 1.4; color: var(--ink2); }
.sheet-lede { margin: 0; color: var(--ink2); }
.level-pick { display: grid; gap: 10px; }
.level { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; text-align: left; padding: 16px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.level .row-ic { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; } .level b { font-weight: 600; font-size: 1.05rem; } .level small { color: var(--ink2); line-height: 1.35; }
.level:active { transform: scale(.98); }

/* Card scanner and hand coach */
.soon { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; background: var(--gold-soft); color: var(--ink); font: 650 .72rem/1.3 inherit; letter-spacing: .02em; white-space: nowrap; }
.soon-panel { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 22px 18px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.soon-panel > b { font: 700 1.15rem var(--display); } .soon-panel > p { margin: 0; color: var(--ink2); font-size: .92rem; line-height: 1.45; max-width: 36ch; }
.soon-ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.code-box.idle { cursor: default; }
.photo-pane { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 18px 16px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.photo-pane > b { font-size: 1.05rem; } .photo-pane > p { margin: 0; color: var(--ink2); font-size: .9rem; line-height: 1.4; max-width: 34ch; }
.photo-pane > .list { width: 100%; text-align: left; }
.photo-pane.busy .photo-ic { animation: pulse 1.1s ease-in-out infinite; }
.photo-ic { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.photo-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
@keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }
.scan-msg { margin: 0; font-size: .86rem; color: var(--ink2); text-align: center; line-height: 1.35; } .scan-msg.err { color: var(--red); }
.hand.busy { opacity: .45; }
.hcard.doubt { box-shadow: 0 0 0 2px var(--gold-ring); }
.hcard { min-width: 44px; width: auto; padding: 0 4px; }
.row-input.boxed { background: var(--fill); border-radius: 10px; padding: 0 12px; }
.coach { display: grid; gap: 12px; margin-top: 10px; padding: 16px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.coach-head { display: flex; gap: 12px; align-items: flex-start; } .coach-head b { display: block; font-weight: 600; } .coach-head small { color: var(--ink2); line-height: 1.35; }
.coach-out { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; }
.coach-out dt { font-size: .8rem; font-weight: 600; color: var(--ink3); padding-top: 2px; } .coach-out dd { margin: 0; line-height: 1.4; }

/* Stats: race, awards, caught bars, profiles */
.race { display: grid; gap: 4px; padding: 14px 16px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 var(--hair) var(--line); }
.lane { display: grid; grid-template-columns: minmax(64px, 22%) 1fr 44px; align-items: center; gap: 10px; min-height: 44px; }
.lane-name { font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-track { position: relative; height: 36px; border-radius: 18px; background: var(--fill); }
.lane-track::after { content: ""; position: absolute; right: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: repeating-linear-gradient(var(--ink) 0 4px, transparent 4px 8px); opacity: .35; }
.lane-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 18px; background: color-mix(in srgb, var(--peg) 34%, var(--surface)); transition: width .7s var(--out-e); }
.lane-peg { position: absolute; top: 50%; transform: translateY(-50%); transition: left .7s var(--spring); }
.lane-total { font: 700 1.1rem var(--num); text-align: right; font-variant-numeric: tabular-nums; }
.race.big { background: transparent; box-shadow: none; padding: 0; gap: 10px; flex: 1; align-content: center; }

.av-sheet .sheet-body { gap: 14px; }

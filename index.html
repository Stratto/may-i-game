function cardValue(code, rules) {
  if (code === "JOKER") return 15;

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, (max || 1400) / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that photo. Try taking it again.")); };
    img.src = url;
  });
}
function extractJSON(text) {
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start < 0 || end <= start) throw new Error("The AI reply couldn't be read. Try another photo.");
  return JSON.parse(text.slice(start, end + 1));
}
async function askClaude(apiKey, dataUrl, prompt) {
  let Anthropic;

  catch (e) { throw new Error("Couldn't load the card reader. Check your internet connection."); }
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true, maxRetries: 1 });
  const b64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
  let res;
  try {
    res = await client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 4000,
      output_config: { effort: "low" },
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } },
        { type: "text", text: prompt },
      ] }],
    });
  } catch (e) {
    if (e instanceof Anthropic.AuthenticationError) throw new Error("Your API key was rejected. Check it in Settings.");
    if (e instanceof Anthropic.PermissionDeniedError) throw new Error("This API key doesn't have access to the card reader model.");
    if (e instanceof Anthropic.RateLimitError) throw new Error("Too many scans at once. Wait a moment and try again.");
    if (e instanceof Anthropic.APIConnectionError) throw new Error("Couldn't reach the card reader. Check your connection.");
    if (e instanceof Anthropic.APIError) throw new Error("The card reader had a problem (" + (e.status || "error") + "). Try again.");
    throw new Error("Something went wrong reading the photo.");
  }
  if (res.stop_reason === "refusal") throw new Error("The card reader couldn't process this photo. Try a clearer shot of just the cards.");
  const text = (res.content || []).filter(b => b.type === "text").map(b => b.text).join("");

}

function useMedia(query) {
  const [m, setM] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query), h = () => setM(mq.matches);
    mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", h) : mq.removeListener(h); };
  }, [query]);
  return m;
}
function CountUp({ value }) {
  const [shown, setShown] = useState(value);
  const prev = useRef(value);
  useEffect(() => {
    const from = prev.current, to = value;
    prev.current = value;
    if (from === to) return;
    if (reducedMotion()) { setShown(to); return; }
    const t0 = performance.now(), dur = 520;
    let raf;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      setShown(Math.round(from + (to - from) * e));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return shown;
}

/* ================================================================
   App
   ================================================================ */
function MayIApp() {
  const [loaded,      setLoaded]      = useState(false);
  const [players,     setPlayers]     = useState([]);
  const [started,     setStarted]     = useState(false);
  const [currentRound,setCurrentRound]= useState(0);
  const [scores,      setScores]      = useState({});
  const [buys,        setBuys]        = useState({});
  const [hands,       setHands]       = useState({});   // round → playerId → counted cards
  const [houseRules,  setHouseRules]  = useState(DEFAULT_RULES);
  const [showSummary, setShowSummary] = useState(false);
  const [dealer,      setDealer]      = useState(0);
  const [tab,         setTab]         = useState("play");
  const [settings,    setSettings]    = useState(() => ({ ...DEFAULT_SETTINGS, ...loadJSON(SETTINGS_KEY, {}) }));
  const [history,     setHistory]     = useState([]);
  const [sheet,       setSheet]       = useState(null);   // { type, ...props }
  const [confirm,     setConfirm]     = useState(null);
  const [toast,       setToast]       = useState(null);
  const savedToHistory = useRef(false);
  const scrollRef      = useRef(null);
  const wide = useMedia("(min-width: 900px)");

  // Theme
  useEffect(() => {
    applyTheme(settings.theme);
    if (settings.theme !== "auto") return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)"), h = () => applyTheme("auto");
    mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", h) : mq.removeListener(h); };
  }, [settings.theme]);
  useEffect(() => { saveJSON(SETTINGS_KEY, settings); }, [settings]);

  // Load saved game
  useEffect(() => {
    const s = loadJSON(STORAGE_KEY, null);
    if (s) {
      setPlayers(s.players || []);
      setStarted(!!s.started);
      setCurrentRound(Math.min(6, s.currentRound || 0));
      setScores(s.scores || {});
      setBuys(s.buys || {});
      setHands(s.hands || {});
      setHouseRules({ ...DEFAULT_RULES, ...(s.houseRules || {}) });
      setShowSummary(!!s.showSummary);
      setDealer(s.dealer || 0);
      savedToHistory.current = !!s.historySaved;
    }
    setHistory(loadJSON(HISTORY_KEY, []));
    setLoaded(true);
  }, []);

  // Save game
  useEffect(() => {
    if (!loaded) return;
    saveJSON(STORAGE_KEY, { players, started, currentRound, scores, buys, hands, houseRules, showSummary, dealer, historySaved: savedToHistory.current });
  }, [loaded, players, started, currentRound, scores, buys, hands, houseRules, showSummary, dealer]);

  // Scroll to top only when the visible tab changes
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [tab, started]);

  // Toast auto-dismiss
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2800);
    return () => clearTimeout(t);
  }, [toast]);

  if (!loaded) return null;

  // ── Derived ──
  const totals = players.map(p => {
    let t = 0;
    Object.values(scores).forEach(r => { const v = r && r[p.id]; if (typeof v === "number") t += v; });
    return { ...p, total: t };
  });
  const ranked = [...totals].sort((a, b) => a.total - b.total);
  const allRoundsScored = players.length > 0 && ROUNDS.every((_, i) => roundIsComplete(scores, i, players));
  const dealerOf = r => players[(dealer + r) % Math.max(players.length, 1)];
  const limit = buyLimitOf(houseRules);

  // ── Actions ──
  const updateRule = (k, v) => setHouseRules(r => ({ ...r, [k]: v }));
  const updateSetting = (k, v) => setSettings(s => ({ ...s, [k]: v }));
  const openSheet = (type, props) => setSheet({ type, ...(props || {}) });
  const closeSheet = () => setSheet(null);

  function addPlayer(name) {
    const clean = name.trim().slice(0, 24);
    if (!clean || players.length >= MAX_PLAYERS) return false;
    haptic(8);
    setPlayers(p => [...p, { id: Date.now() + "-" + Math.random().toString(36).slice(2, 6), name: clean }]);
    return true;
  }
  function removePlayer(id) {
    setPlayers(p => {
      const next = p.filter(x => x.id !== id);
      setDealer(d => Math.min(d, Math.max(next.length - 1, 0)));
      return next;
    });
  }
  function setHand(r, pid, cards) {
    setHands(h => {
      const next = { ...h, [r]: { ...(h[r] || {}) } };
      if (cards && cards.length) next[r][pid] = cards; else delete next[r][pid];
      return next;
    });
  }
  function setRoundScore(r, pid, val, cards) {
    setHand(r, pid, val === 0 ? [] : cards);
    setScores(s => {
      const next = { ...s, [r]: { ...(s[r] || {}) } };
      if (val === "" || val == null || isNaN(val)) delete next[r][pid];
      else next[r][pid] = Math.max(0, Math.min(999, Math.round(Number(val))));
      return next;
    });
  }
  function changeBuy(pid, delta) {
    const count = (buys[currentRound] && buys[currentRound][pid]) || 0;
    const next = count + delta;
    if (next < 0 || (limit !== Infinity && next > limit)) return;
    haptic(6);
    setBuys(b => ({ ...b, [currentRound]: { ...(b[currentRound] || {}), [pid]: next } }));
  }
  function saveToHistory() {
    if (savedToHistory.current) return;
    savedToHistory.current = true;
    const top = ranked.filter(p => p.total === ranked[0].total);
    const entry = { date: Date.now(), winner: top.map(p => p.name).join(" & "), players: ranked.map(p => ({ name: p.name, total: p.total })) };
    const next = [entry, ...loadJSON(HISTORY_KEY, [])].slice(0, 5);
    saveJSON(HISTORY_KEY, next);
    setHistory(next);
  }
  function finishGame() { saveToHistory(); haptic(20); setShowSummary(true); }

      const rs = scores[currentRound];
      const best = Math.min(...players.map(p => rs[p.id]));
      const winners = players.filter(p => rs[p.id] === best).map(p => p.name);

      haptic(14);

  }
  function doReset() {
    savedToHistory.current = false;
    setScores({}); setBuys({}); setHands({}); setCurrentRound(0); setStarted(false);
    setShowSummary(false); setDealer(0); setConfirm(null); setSheet(null); setTab("play");
  }
  function askNewGame() {
    const hasData = Object.values(scores).some(r => r && Object.keys(r).length) || Object.values(buys).some(r => r && Object.keys(r).length);
    if (!hasData) { doReset(); return; }
    setConfirm({ title: "Start a new game?", message: "This clears every score and buy from the current game. Your players and house rules stay.",
      confirmLabel: "New game", danger: true, onConfirm: doReset });
  }
  function startGame() {
    haptic(14);
    setStarted(true); setTab("play");
    if (settings.level === "new") setTimeout(() => openSheet("guide", { round: 0 }), 450);
  }

  const common = { players, scores, buys, houseRules, settings, wide, currentRound, ranked, allRoundsScored, limit, dealerOf, openSheet };

  // ── Views ──
  let view;
  if (!started) {
    view = ce(Setup, { ...common, history, dealer, setDealer, addPlayer, removePlayer, updateRule, onStart: startGame });
  } else if (tab === "scores") {
    view = ce(ScoresView, { ...common, hands, onFinish: finishGame });
  } else if (tab === "rules") {
    view = ce(RulesView, { ...common, updateRule, setLevel: v => updateSetting("level", v) });
  } else {
    view = ce(PlayView, { ...common, setRoundScore, changeBuy, nextRound });
  }

  const page = ce("div", { key: started ? tab : "setup", className: "page view-enter" + (started ? "" : " setup-page") }, view);
  let shell;
  if (!started) {
    shell = ce("div", { className: "app" },
      ce("main", { className: "main" }, ce("div", { className: "scroll", ref: scrollRef }, page)));
  } else if (wide) {
    shell = ce("div", { className: "app wide" },
      ce(Rail, { tab, setTab, currentRound, scores, players, dealerOf, allRoundsScored,
        onSettings: () => openSheet("settings"), onNewGame: askNewGame, onResults: finishGame }),
      ce("main", { className: "main" }, ce("div", { className: "scroll", ref: scrollRef }, page)));
  } else {
    shell = ce("div", { className: "app" },
      ce(TopBar, { currentRound, scores, players, dealerOf, onSettings: () => openSheet("settings") }),
      ce("main", { className: "main" }, ce("div", { className: "scroll", ref: scrollRef }, page)),
      ce(TabBar, { tab, setTab }));
  }

  // ── Overlays ──
  let sheetEl = null;
  if (sheet) {
    const base = { onClose: closeSheet, wide };
    if (sheet.type === "guide") sheetEl = ce(Sheet, { ...base, title: "Round " + (sheet.round + 1) + " guide",
      footer: ce("button", { className: "btn btn-primary btn-block", onClick: closeSheet }, "Got it") },
      ce(RoundGuide, { round: sheet.round, level: settings.level, houseRules, dealerName: started ? (dealerOf(sheet.round) || {}).name : null }));
    else if (sheet.type === "learn") sheetEl = ce(Sheet, { ...base, title: "Learn May I? in 60 seconds",
      footer: ce("button", { className: "btn btn-primary btn-block", onClick: closeSheet }, "Let's play") },

    else if (sheet.type === "helper") sheetEl = ce(HandHelper, { ...base, round: currentRound, houseRules, level: settings.level,
      apiKey: settings.apiKey, openSettings: () => openSheet("settings") });

  return ce(Fragment, null,
    ce(StyleInjector),
    shell,
    showSummary && ce(GameSummary, { ranked, scores, buys, hands, players, houseRules, wide, onPlayAgain: () => { setShowSummary(false); doReset(); }, onDismiss: () => setShowSummary(false) }),
    sheetEl,
    confirm && ce(ConfirmModal, { ...confirm, onCancel: () => setConfirm(null) }),
    toast && ce("div", { key: toast.id, className: "toast", role: "status" }, ce(Icon, { n: "check", size: 18 }), toast.text));

function ScorePanel({ players, scores, round, setRoundScore, onCount }) {
  const [pending, setPending] = useState({});

  useEffect(() => { setAutoOut(null); }, [round]);
  const entered = players.filter(p => typeof rs[p.id] === "number").length;
  const outPlayer = players.find(p => rs[p.id] === 0);   // only one player can go out per round
  const clearPending = pid => setPending(ps => { const n = { ...ps }; delete n[pid]; return n; });

  function commit(pid) {
    if (justOut.current[pid]) { delete justOut.current[pid]; return; }
    if (!(pid in pending)) return;
    const raw = pending[pid], v = raw === "" ? "" : parseInt(raw, 10);
    setRoundScore(round, pid, v);

    if (autoOut === pid) setAutoOut(null);

              : "Not scored")),

            onPointerDown: e => { e.preventDefault(); if (!(outPlayer && !out)) toggleOut(p.id); },

function computeInsights({ players, scores, buys, hands, houseRules }) {
  const done = ROUNDS.map((_, i) => i).filter(i => roundIsComplete(scores, i, players));
  const per = players.map(p => {
    const rs = done.map(i => ({ i, v: scores[i][p.id] }));
    const outs = rs.filter(x => x.v === 0).length;
    const buyN = Object.values(buys || {}).reduce((sum, r) => sum + ((r && r[p.id]) || 0), 0);
    let worst = null, best = null, comeback = null;
    rs.forEach((x, k) => {
      if (!worst || x.v > worst.v) worst = x;
      if (!best || x.v < best.v) best = x;
      if (k > 0) { const d = rs[k - 1].v - x.v; if (!comeback || d > comeback.d) comeback = { d, from: rs[k - 1].v, to: x.v, i: x.i }; }

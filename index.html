/* On-device saving via Safari storage, matching the app's storage interface. */
(function(){
  try {
    var ls = window.localStorage;
    ls.setItem('__t','1'); ls.removeItem('__t');
    window.storage = {
      get: function(k){ var v = ls.getItem(k); return Promise.resolve(v==null?null:{key:k,value:v}); },
      set: function(k,v){ ls.setItem(k,String(v)); return Promise.resolve({key:k,value:String(v)}); },
      delete: function(k){ ls.removeItem(k); return Promise.resolve({key:k,deleted:true}); },
      list: function(){ return Promise.resolve({keys:Object.keys(ls)}); }
    };
  } catch(e){ /* private mode etc. -> app falls back to in-memory */ }

<script>
(function(){
  var React = window.React, ReactDOM = window.ReactDOM;
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef, useMemo = React.useMemo;

/* ================================================================
   May I? · v5 "Score Track"
   Groups → games. Every player row is a lane; pegs race to the finish.
   ================================================================ */

// ── Live sharing (Supabase). Leave blank to run on this device only. ─
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
const SUPPORT_URL = "https://ko-fi.com/mayigame";

// ── Storage ───────────────────────────────────────────────────────
const STORE_KEY = "mayi:v5";
const MAX_PLAYERS = 8;
function loadJSON(k, f) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function haptic(ms) { try { if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }
const reducedMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const newCode = () => Array.from({ length: 6 }, () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join("");
const now = () => Date.now();

// Peg colours: each player keeps one for life in a group.
const PEGS = [
  { k: "red",    c: "#D63B3B", ink: "#FFFFFF" },
  { k: "blue",   c: "#2563D9", ink: "#FFFFFF" },
  { k: "green",  c: "#178A4C", ink: "#FFFFFF" },
  { k: "amber",  c: "#F0A81C", ink: "#13233F" },
  { k: "purple", c: "#7A4BD8", ink: "#FFFFFF" },
  { k: "teal",   c: "#0B8F9E", ink: "#FFFFFF" },
  { k: "pink",   c: "#D13F93", ink: "#FFFFFF" },
  { k: "orange", c: "#E5631A", ink: "#FFFFFF" },
];
const peg = k => PEGS.find(p => p.k === k) || PEGS[0];

// ── Game data ─────────────────────────────────────────────────────
const ROUNDS = [
  { n:1, name:"Two Sets",         cards:10, ex:[["7S","7H","7C"],["KD","KS","KH"]], tip:"Keep your pairs. Each is one card from a set.", watch:"Suits don't matter in a set." },
  { n:2, name:"Set & Run",        cards:10, ex:[["5C","5D","5H"],["8H","9H","10H","JH"]], tip:"Keep cards that touch, like 8♥ 9♥.", watch:"A run needs 4 cards in one suit." },

/* Page shell */

/* Buttons */

  transition: transform .12s var(--ease), background .15s, opacity .15s; }

@media (max-width: 380px) { .home-actions { grid-template-columns: 1fr; } }

/* Peg */
.peg { flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--peg); color: var(--peg-ink); font-weight: 800; line-height: 1;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.14); }
.peg.ring { box-shadow: inset 0 -2px 0 rgba(0,0,0,.14), 0 0 0 3px var(--surface), 0 0 0 5.5px var(--gold-ring); }

/* Home */
.groups { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }

/* Panels + group */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; }

.resume { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--navy); color: var(--on-navy); border-radius: var(--r); padding: 16px; min-height: 72px; }

/* Lanes: the score track */
.lanes { list-style: none; margin: 0; padding: 0; }

.lanes-head { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px 6px; font-size: .82rem; font-weight: 700; color: var(--ink-3); }

/* Buys + scoring */

.score-in.zero { background: var(--green-soft); border-color: transparent; color: var(--green); }
.score-in::placeholder { color: var(--ink-3); }
.lanes.scoring .lane-total { display: none; }
.lanes.scoring .lane-track { display: none; }

/* Game shell */
.game { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.game-bar { background: var(--navy); color: var(--on-navy); padding: calc(env(safe-area-inset-top) + 6px) max(16px, env(safe-area-inset-right)) 18px max(16px, env(safe-area-inset-left)); border-radius: 0 0 22px 22px; }

.c-deal svg { color: var(--on-navy-2); }

.pc { width: 26px; height: 36px; border-radius: 5px; background: #fff; color: var(--ink); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 0 0 1px rgba(19,35,63,.18); }

.pc.red { color: var(--red); }
.game-main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.game-lanes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; max-width: 760px; margin: 0 auto; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: linear-gradient(rgba(233,239,246,0), var(--board) 30%); }

.game-side { display: grid; gap: 16px; position: sticky; top: 16px; }

.game.wide .dock { left: auto; width: calc(min(1200px, 100vw) - 380px - 32px); right: max(16px, calc((100vw - 1200px) / 2 + 16px)); padding-left: 0; padding-right: 0; background: none; }
.game.wide .lane-total { font-size: 2rem; }

/* Scoreboard mode */
.scoreboard { min-height: 100vh; min-height: 100dvh; background: var(--navy); padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 20px; }
.sb-head { display: flex; align-items: baseline; gap: 16px; color: var(--on-navy); flex-wrap: wrap; }

/* Round grid */

.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

/* Recap */
.winner { text-align: center; padding: 18px 0 4px; }
.winner-pegs { display: flex; justify-content: center; gap: 12px; }
.winner-pegs .peg { font-size: 2rem !important; animation: pop .6s var(--ease) both; }

.award { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }

.award small { font-size: .78rem; font-weight: 700; color: var(--ink-3); }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(19,35,63,.38); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
.scrim.out { animation: fade .2s ease reverse both; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
  box-shadow: 0 -8px 40px rgba(19,35,63,.18); animation: up .32s var(--ease) both; }

.sheet.drag { animation: none; transition: none; }

@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 22px; max-height: 86vh; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 10px 6px 20px; position: relative; touch-action: none; }
.grab { position: absolute; top: 6px; left: 50%; width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); transform: translateX(-50%); }
.sheet-head h2 { flex: 1; margin: 6px 0 0; font-size: 1.3rem; letter-spacing: -.02em; }

.field { display: grid; gap: 6px; font-weight: 700; font-size: .9rem; }
.text-in, .name-in { width: 100%; min-height: 48px; border: 1.5px solid var(--line-2); border-radius: 12px; padding: 0 14px; background: var(--surface); font-weight: 600; font-size: 1rem; }
.text-in:focus, .name-in:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(37,99,217,.2); }
.code-in { font-size: 1.5rem; letter-spacing: .2em; text-align: center; font-weight: 800; text-transform: uppercase; }
.sub { font-size: 1rem; font-weight: 800; margin: 10px 0 0; }
.sub .muted { font-weight: 600; font-size: .85rem; }
.roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.roster li { display: flex; align-items: center; gap: 8px; }
.peg-btn { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; }
.name-in { min-height: 44px; border-color: var(--line); }
.add-row { display: flex; gap: 8px; }
.pick { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

.box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; color: #fff; }
.pick li.on .box { background: var(--navy); border-color: var(--navy); }
.pick li:not(.on) .pick-check { opacity: .6; }
.deal-chip { min-height: 36px; padding: 0 12px; border-radius: 99px; font-size: .82rem; font-weight: 800; color: var(--ink-3); border: 1px solid var(--line); }
.deal-chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.group-box { border: 1px solid var(--line); border-radius: var(--r); }

.opt + .opt { border-top: 1px solid var(--line); }

.switch { width: 52px; height: 32px; border-radius: 99px; background: #C5CFDD; position: relative; transition: background .2s; flex: none; }
.switch span { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch.on { background: var(--green); } .switch.on span { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 16px; justify-content: center; }

.round-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; }
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--gold-soft); color: #6B4A00; border-radius: 12px; padding: 12px 14px; font-size: .9rem; font-weight: 600; }
.note svg { flex: none; margin-top: 1px; }
.code-box { text-align: center; padding: 18px; border-radius: var(--r); background: var(--board); }
.code-box small { display: block; font-weight: 700; color: var(--ink-3); }
.code { font-size: 2.4rem; letter-spacing: .14em; font-weight: 800; }
.row-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; min-height: 60px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); }
.row-link small { display: block; color: var(--ink-3); font-size: .85rem; }
.tip-link { text-align: center; color: var(--ink-3); font-size: .9rem; padding: 10px; text-decoration: none; }
.tip-link b { color: var(--ink); }
.rules-round { display: grid; gap: 10px; }
.big { font-size: 1.7rem; letter-spacing: -.03em; margin: 6px 0 0; }
.rules-round .muted { margin: 0; }
.melds-lg { background: var(--navy); border-radius: var(--r); padding: 16px; }
.melds-lg .pc { width: 34px; height: 46px; } .melds-lg .pc b, .melds-lg .pc i { font-size: .95rem; }
.facts, .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.facts li { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--board); font-weight: 600; }
.facts svg { flex: none; margin-top: 1px; color: var(--ink-2); }
.all-rounds { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.all-rounds li { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: .88rem; font-weight: 600; }
.all-rounds li.on { border-color: var(--navy); background: var(--navy); color: #fff; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.step-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--board); display: grid; place-items: center; flex: none; color: var(--ink-2); }
.steps b { display: block; } .steps span { color: var(--ink-2); font-size: .92rem; }
.values { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.values div { background: var(--board); border-radius: 10px; padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.values span { font-size: .78rem; color: var(--ink-3); font-weight: 700; } .values b { font-size: 1.05rem; }
.count-total { text-align: center; } .count-total b { display: block; font-size: 3.4rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.count-total span { color: var(--ink-3); font-weight: 700; }
.hand { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 58px; align-content: center; }
.hcard { width: 44px; height: 58px; border-radius: 8px; border: 1px solid var(--line-2); display: grid; place-content: center; text-align: center; animation: pop .25s var(--ease) both; }
.hcard b { font-size: 1rem; } .hcard small { font-size: .7rem; color: var(--ink-3); }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.key { min-height: 56px; border-radius: 12px; background: var(--board); display: grid; place-content: center; text-align: center; transition: transform .1s var(--ease); }
.key:active { transform: scale(.94); background: var(--board-2); }
.key b { font-size: 1.15rem; } .key small { font-size: .72rem; color: var(--ink-3); font-weight: 700; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: #fff; border-radius: 14px;
  padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: .92rem; width: max-content; max-width: calc(100vw - 32px); animation: up .3s var(--ease) both; box-shadow: 0 8px 24px rgba(19,35,63,.25); }
.toast span { padding: 6px 0; }
.toast button { color: #8FB6FF; font-weight: 800; min-height: 36px; padding: 0 10px; border-radius: 9px; }


/* ── v5.1: home, champion, score pad, round intro ── */
.home .title { margin-bottom: 4px; }
.live-card { display: grid; gap: 6px; text-align: left; background: var(--navy); color: var(--on-navy); border-radius: 18px; padding: 16px 18px 18px; transition: transform .15s var(--ease); }
.live-card:active { transform: scale(.985); }
.live-top { display: flex; align-items: center; }
.live-card .badge.live { background: rgba(255,255,255,.12); color: #fff; display: inline-flex; align-items: center; gap: 6px; }
.badge.live i { width: 7px; height: 7px; border-radius: 50%; background: #4ADE80; animation: blink 1.6s ease-in-out infinite; }
.live-go { display: inline-flex; align-items: center; font-weight: 800; }
.live-name { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; margin-top: 4px; }
.live-sub { color: var(--on-navy-2); font-size: .92rem; margin-bottom: 6px; }
.live-card .lane-track { background: rgba(255,255,255,.14); background-image: radial-gradient(circle, rgba(255,255,255,.3) 1.4px, transparent 1.6px); background-size: 14px 8px; background-position: 3px 0; }
.live-card .lane-track::after { background: #fff; }
.live-card .lane-peg { box-shadow: 0 0 0 2.5px var(--navy); }
.live-card .lane-peg.gold { box-shadow: 0 0 0 2.5px var(--navy), 0 0 0 4.5px var(--gold-ring); }
.live-card .mini-name, .live-card .mini-v { color: var(--on-navy-2); }
.group-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.group-card { display: grid; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; color: var(--ink); transition: border-color .15s, transform .15s var(--ease); }
.group-card:hover { border-color: var(--line-2); }
.group-card:active { transform: scale(.985); }
.gc-head { display: flex; align-items: flex-start; gap: 8px; }
.gc-head > svg { color: var(--ink-3); margin-top: 3px; flex: none; }
.gc-head .gr-main b { font-size: 1.25rem; letter-spacing: -.02em; }
.mini { display: grid; gap: 10px; }
.mini-row { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; }
.mini-name { font-size: .85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-v { font-size: .8rem; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.mini .lane-track { height: 6px; background-size: 12px 6px; }
.mini .lane-peg { width: 13px; height: 13px; }
.lane-peg.gold { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--gold-ring); }
.champ { display: flex; align-items: center; gap: 16px; padding: 4px 0; }
.champ-text { flex: 1; min-width: 0; }
.champ-line { margin: 6px 0 0; font-weight: 700; color: var(--gold); }
.champ-peg { position: relative; flex: none; padding-top: 18px; margin-right: 6px; }
.champ-peg .peg { font-size: 1.7rem !important; }
.crown { position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-8deg); color: var(--gold-ring); }
.crown svg { fill: currentColor; stroke: var(--gold); stroke-width: 1.4; }
.round-chip { flex: none; min-height: 32px; padding: 0 9px; border-radius: 9px; background: var(--board); color: var(--ink-2); font-weight: 800; font-size: .82rem; font-variant-numeric: tabular-nums; }
.round-chip.out { background: var(--green-soft); color: var(--green); }
.lane .lane-peg-wrap { align-self: flex-start; margin-top: 2px; }
.pad-who { display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 4px; scrollbar-width: none; }
.pad-who::-webkit-scrollbar { display: none; }
.who { flex: none; display: grid; justify-items: center; gap: 3px; min-width: 66px; padding: 8px 6px; border-radius: 14px; border: 1.5px solid transparent; transition: background .15s, border-color .15s; }
.who span { font-size: .8rem; font-weight: 700; max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who b { font-size: .82rem; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.who.done b { color: var(--ink); }
.who.on { background: var(--board); border-color: var(--navy); }
.who:not(.on):not(.done) .peg { opacity: .55; }
.pad-display { text-align: center; padding: 6px 0 2px; display: grid; }
.pad-display span { font-weight: 700; color: var(--ink-2); }
.pad-display b { font-size: 4.2rem; line-height: 1; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.pad-display small { color: var(--ink-3); font-weight: 600; }
.pad-display.zero b { color: var(--green); }
.pad-display.empty b { color: var(--line-2); }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.nk { min-height: 58px; border-radius: 14px; background: var(--board); font-size: 1.5rem; font-weight: 800; display: grid; place-items: center; transition: transform .1s var(--ease), background .12s; font-variant-numeric: tabular-nums; }
.nk:active { transform: scale(.95); background: var(--board-2); }
.nk.fn { background: transparent; font-size: .95rem; color: var(--ink-2); }
.btn.out-big { background: var(--green-soft); color: var(--green); flex: none; }
.btn.out-big.on { background: var(--green); color: #fff; }
.btn.out-big:disabled { background: var(--board); color: var(--ink-3); }
.intro { position: fixed; inset: 0; z-index: 35; background: rgba(13,24,44,.86); display: grid; place-items: center; padding: 20px; animation: fade .25s ease both; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.intro-card { width: 100%; max-width: 420px; color: #fff; text-align: center; display: grid; gap: 12px; justify-items: center; position: relative; }
.intro-won { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.1); font-weight: 700; font-size: .9rem; color: #FFE08A; animation: rise .4s var(--ease) both; }
.pips.big { width: 100%; max-width: 280px; margin-top: 10px; }
.pips.big i { height: 6px; }
.pips.big i.now { animation: pipfill .6s .2s var(--ease) both; transform-origin: left; }
.intro-n { color: var(--on-navy-2); font-weight: 700; margin-top: 6px; animation: rise .45s .15s var(--ease) both; }
.intro h2 { margin: 0; font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1; letter-spacing: -.035em; text-wrap: balance; animation: rise .5s .22s var(--ease) both; }
.intro-melds { margin: 10px 0 4px; }
.intro-melds .pc { width: 38px; height: 52px; animation: deal .45s var(--ease) both; }
.intro-melds .pc b, .intro-melds .pc i { font-size: 1rem; }
.intro-melds .meld:nth-child(1) .pc { animation-delay: .35s; } .intro-melds .meld:nth-child(2) .pc { animation-delay: .5s; } .intro-melds .meld:nth-child(3) .pc { animation-delay: .65s; }
.intro-melds .melds { justify-content: center; gap: 12px; }
.intro-deal { margin: 0; color: var(--on-navy-2); }
.intro .row2 { width: 100%; margin-top: 14px; }
.btn.light { background: #fff; color: var(--navy); }
.intro-timer { position: absolute; left: 0; right: 0; bottom: -18px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.5); transform-origin: left; animation: drain 4.2s linear both; }
.sb-head .melds { align-self: center; }
@keyframes blink { 50% { opacity: .35; } }
@keyframes pipfill { from { transform: scaleX(0); } }
@keyframes deal { from { transform: translateY(-40px) rotate(-12deg); opacity: 0; } }
@keyframes drain { to { transform: scaleX(0); } }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.toast { --x: -50%; } @keyframes up-t { from { transform: translate(-50%, 24px); opacity: 0; } } .toast { animation-name: up-t; }
@keyframes down { to { transform: translateY(40px); opacity: 0; } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }

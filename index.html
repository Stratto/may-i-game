    const mq = matchMedia("(prefers-color-scheme: dark)"), h = () => applyLook(settings.look); mq.addEventListener("change", h); return () => mq.removeEventListener("change", h); }, [settings]);

  background: linear-gradient(165deg, #FFFFFF, #F4F2EC); box-shadow: 0 0 0 .5px rgba(0,0,0,.12), var(--lift); animation: deal2 .65s var(--spring) both; }
.intro.out .intro-card { animation: dealOut .26s var(--ease) both; }
@keyframes deal2 { from { opacity: 0; transform: translateY(60px) rotate(-6deg) scale(.9); } }
@keyframes dealOut { to { opacity: 0; transform: translateY(-24px) rotate(3deg) scale(.96); } }
.ic-idx { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: .9; font-family: var(--numf); color: #141414; }
.intro-card.red .ic-idx { color: #C8283A; }
.ic-idx b { font-size: 1.7rem; font-weight: 700; } .ic-idx i { font-style: normal; font-size: 1.3rem; }
.ic-idx.tl { top: 16px; left: 18px; } .ic-idx.br { bottom: 16px; right: 18px; transform: rotate(180deg); }
.intro-n { font-size: .76rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: #7A7A72; }
.intro-card h2 { font-family: var(--disp); font-size: 2.1rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.05; margin: -6px 0 4px; }
.intro-card .melds { justify-content: center; }
.intro-deal { margin: 4px 0 0; font-size: .98rem; color: #3D3D38; }
.intro-tip { margin: 0; font-size: .86rem; line-height: 1.4; color: #6B6B64; max-width: 24ch; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .3s var(--ease) both; }
.scrim.out { animation: fadeOut .22s var(--ease) both; }
.sheet { width: 100%; max-width: 620px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--surface2); color: var(--ink); border-radius: 26px 26px 0 0;
  box-shadow: var(--lift); padding-bottom: env(safe-area-inset-bottom); animation: up .5s var(--out) both; }
.sheet.tall { height: 92dvh; }
.sheet.out { animation: down .22s var(--ease) both; } .sheet.drag { animation: none; transition: none; }
@media (min-width: 820px) { .scrim { align-items: center; } .sheet { border-radius: 26px; max-height: 86dvh; } .sheet.tall { height: 86dvh; } }
.sheet-head { position: relative; display: flex; align-items: center; gap: 10px; padding: 18px 18px 8px; touch-action: none; }
.grab { position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--line); }
.sheet-head h2 { flex: 1; margin: 0; font-family: var(--disp); font-size: 1.35rem; font-weight: 750; letter-spacing: -.02em; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 18px 22px; overscroll-behavior: contain; }
.sheet-foot { padding: 12px 18px 14px; border-top: 1px solid var(--line); }
.sheet .label { color: var(--ink); }
@keyframes fade { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } } @keyframes down { to { transform: translateY(100%); } }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--fill); }
.seg button { flex: 1; min-height: 40px; border-radius: 10px; font-size: .88rem; font-weight: 600; color: var(--ink2); padding: 0 6px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.switch { width: 51px; height: 31px; border-radius: 99px; background: var(--fill); position: relative; flex-shrink: 0; box-shadow: inset 0 0 0 1px var(--line); }
.switch span { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 99px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.2); transition: transform .4s var(--spring); }
.switch.on { background: var(--accent); } .switch.on span { transform: translateX(20px); }

/* Rules */
.rules-round { padding-top: 16px; }
.big { font-family: var(--disp); font-size: 1.8rem; font-weight: 800; letter-spacing: -.03em; margin: 0; }
.lede { margin: 4px 0 14px; color: var(--ink2); }
.fact { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); font-size: .95rem; }
.fact svg { flex-shrink: 0; margin-top: 1px; color: var(--ink3); }
.fact.good svg { color: var(--accent); } .fact.warn svg { color: var(--red); }
.mini-rounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.mr { padding: 8px 10px; border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; font-size: .78rem; color: var(--ink2); }
.mr b { font-family: var(--numf); font-size: 1rem; color: var(--ink); }
.mr.on { box-shadow: inset 0 0 0 2px var(--accent); }
.steps { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); }
.steps li > div { display: flex; flex-direction: column; } .steps li span { font-size: .88rem; color: var(--ink2); }
.step-ic { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: inline-flex !important; align-items: center; justify-content: center; background: var(--fill); color: var(--accent) !important; }
.values { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.values div { padding: 10px 6px; border-radius: 12px; background: var(--surface); text-align: center; display: flex; flex-direction: column; gap: 2px; }
.values span { font-size: .78rem; color: var(--ink3); } .values b { font-family: var(--numf); font-size: 1.15rem; }
.group { margin-top: 16px; background: var(--surface); border-radius: var(--r); }
.grow-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; min-height: 58px; }
.grow-row + .grow-row { border-top: 1px solid var(--line); }
.grow-row.col { flex-direction: column; align-items: stretch; }
.stepper { display: flex; align-items: center; gap: 16px; justify-content: center; }
.stepper b { font-family: var(--numf); font-size: 1.3rem; min-width: 30px; text-align: center; }

/* Standings */
.rank { list-style: none; margin: 10px 0 0; padding: 0; background: var(--surface); border-radius: var(--r); overflow: hidden; }
.rank li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 60px; }
.rank li + li { border-top: 1px solid var(--line); }
.rank li.lead { background: var(--gold-soft); }
.rk { width: 28px; text-align: center; font-family: var(--numf); font-weight: 800; color: var(--ink3); display: inline-flex; justify-content: center; }
.rank li.lead .rk { color: var(--gold); }
.rk-name { flex: 1; min-width: 0; font-weight: 650; display: flex; flex-direction: column; }
.rk-name small { font-weight: 500; font-size: .8rem; color: var(--ink3); }
.rk-total { font-family: var(--numf); font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.awards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.award { padding: 12px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 1px; }
.aw-ic { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--gold-soft); color: var(--gold); margin-bottom: 6px; }
.award small { font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); }
.award span { font-size: .85rem; color: var(--ink3); }
.bars { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r); background: var(--surface); }
.bar { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 10px; font-size: .88rem; }
.bar i { height: 10px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.bar em { display: block; height: 100%; border-radius: 99px; background: var(--accent); animation: grow .8s var(--out) both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }
.bar b { text-align: right; font-family: var(--numf); }
.grid-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--r); }
.sgrid { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 420px; }
.sgrid th, .sgrid td { padding: 10px 6px; text-align: center; font-size: .9rem; }
.sgrid th { font-size: .75rem; color: var(--ink3); font-weight: 650; } .sgrid th.now { color: var(--gold); }
.sgrid tr + tr td, .sgrid tbody tr:first-child td { border-top: 1px solid var(--line); }
.sgrid .l { text-align: left; padding-left: 14px; font-weight: 600; } .sgrid .t { font-weight: 800; } .sgrid .zero { color: var(--accent); font-weight: 800; }

/* Counter */
.count-total { display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 8px 0 12px; }
.count-total b { font-family: var(--numf); font-size: 3.6rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--accent); }
.count-total span { color: var(--ink3); }
.hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 64px; padding: 4px 0 14px; }
.hcard { width: 44px; height: 60px; border-radius: 8px; background: var(--card-face); color: var(--card-ink); box-shadow: 0 0 0 1.5px var(--card-edge), 0 3px 0 var(--card-edge);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--numf); animation: pop .35s var(--out) both; }
.hcard b { font-size: 1.15rem; font-weight: 800; } .hcard small { font-size: .62rem; font-weight: 800; color: var(--gold); margin-top: 2px; }
.hcard.red { color: var(--card-red); }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.key { aspect-ratio: 5 / 6; border-radius: 12px; background: var(--card-face); color: var(--card-ink); box-shadow: 0 0 0 1px var(--card-edge), 0 2px 0 var(--card-edge);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--numf); }
.key b { font-size: 1.3rem; font-weight: 800; line-height: 1; } .key small { font-size: .66rem; font-weight: 700; opacity: .55; }
.key.joker { color: var(--card-red); grid-column: span 2; aspect-ratio: auto; }
.key:active:not(:disabled) { transform: scale(.9) translateY(1px); }

/* Results */
.fireworks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 120; }
.winner { text-align: center; padding: 6px 0 12px; display: flex; flex-direction: column; align-items: center; }
.trophy { width: 96px; height: 96px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--gold-soft); color: var(--gold); animation: trophy 1s .1s var(--spring) both; }
@keyframes trophy { from { opacity: 0; transform: scale(.3) rotate(-20deg); } }
.winner small { margin-top: 10px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.winner h3 { font-family: var(--disp); font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin: 2px 0; }
.winner span { color: var(--ink3); }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 10px 0 16px; }
.pod { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pod b { font-size: .92rem; } .pod > span:not(.avatar) { font-family: var(--numf); color: var(--ink3); font-size: .85rem; }
.pod i { width: 100%; display: flex; justify-content: center; padding-top: 8px; font-style: normal; font-family: var(--numf); font-weight: 800; font-size: 1.4rem; color: #fff;
  border-radius: 14px 14px 4px 4px; transform-origin: bottom; animation: riseUp .9s var(--ease) both; }
.pod.p1 i { height: 110px; background: linear-gradient(#F2C458, #D9A232); animation-delay: .7s; }
.pod.p2 i { height: 82px; background: linear-gradient(#C4CCD1, #A3ADB3); animation-delay: .45s; }
.pod.p3 i { height: 62px; background: linear-gradient(#DDA676, #BF8452); animation-delay: .25s; }
@keyframes riseUp { from { transform: scaleY(0); } }

/* Toast */
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); z-index: 160; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
  max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: .92rem; box-shadow: var(--lift);
  animation: toast 2.6s var(--ease) both; }
.toast.act { animation-duration: 5s; padding-right: 8px; }
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { min-height: 34px; padding: 0 14px; border-radius: 99px; background: rgba(127,127,127,.3); font-weight: 700; flex-shrink: 0; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
.tip-link { display: block; text-align: center; margin-top: 20px; padding: 10px; font-size: .9rem; color: var(--ink3); text-decoration: none; }
.tip-link b { color: var(--red); }
.art { display: block; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }

/* ── Looks: materials and effects ─────────────────────────────── */

[data-look="pop"] .band-title { font-weight: 800; letter-spacing: -.035em; }

[data-look="pop"] .panel, [data-look="pop"] .row-link, [data-look="pop"] .rank, [data-look="pop"] .award, [data-look="pop"] .fact, [data-look="pop"] .steps li,

[data-look="pop"] .intro-card { box-shadow: 0 0 0 3px #1C1A3A, 0 10px 0 3px #1C1A3A; }
[data-look="pop"] .wordmark { font-weight: 800; letter-spacing: -.045em; }
[data-look="pop"] .toast { background: #1C1A3A; color: #fff; }

/* Midnight: deep navy, electric lime, wide display face, glow only on key moments */

[data-look="midnight"] .band { background: linear-gradient(160deg, #3A2E9A 0%, #24206A 45%, #14143C 100%); box-shadow: 0 20px 40px -20px rgba(80,60,220,.6); }

[data-look="midnight"] .intro-card { box-shadow: 0 0 0 1px rgba(255,255,255,.3), 0 0 80px -10px rgba(120,100,255,.6); }

/* Fresh: soft, rounded, gentle */

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }
